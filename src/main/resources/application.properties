spring.application.name=authz-fuzzer
spring.main.banner-mode=off

# In-memory H2: every run starts from the same seed data.
spring.datasource.url=jdbc:h2:mem:authz;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# The H2 web console is only switched on in the dev profile (application-dev.properties).
spring.h2.console.enabled=false

# Logging: application at INFO; SQL off by default (set to DEBUG to see statements).
logging.level.root=INFO
logging.level.io.github.authzfuzzer=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
