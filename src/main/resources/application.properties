spring.application.name=authz-fuzzer

# In-memory H2: every run starts from the same seed data.
spring.datasource.url=jdbc:h2:mem:authz;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# The H2 web console is only switched on in the dev profile (application-dev.properties).
spring.h2.console.enabled=false
